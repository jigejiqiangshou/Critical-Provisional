<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前端样本</title>
<style>
  body { margin: .75rem; font: .9rem/1.5 system-ui, sans-serif; }
  canvas { display: block; width: min(100%, 320px); }
</style>
</head>
<body>
<p id="result">正在验证沙盒</p>
<button id="navigate" type="button">验证导航撤销</button>
<!-- THREE -->
<script>
  const legacyImages = /* LEGACY_IMAGES */ []
  const mark = new URL(location.href).searchParams.get('instance')
  const result = document.querySelector('#result')
  const scope = new URL('../', location.href)
  document.querySelector('#navigate').addEventListener('click', () => {
    location.replace(new URL('navigation-target.html', scope))
  })

  function denial(read) {
    try { read(); return 'allowed' }
    catch (error) { return error.name }
  }

  async function denialAsync(read) {
    try { await read(); return 'allowed' }
    catch (error) { return error.name }
  }

  async function verifyIsolation() {
    const violation = new Promise(resolve => {
      document.addEventListener('securitypolicyviolation', event => {
        if (event.effectiveDirective === 'connect-src') resolve(event.effectiveDirective)
      }, { once: true })
      setTimeout(() => resolve(null), 2000)
    })
    return {
      origin: self.origin,
      parentDom: denial(() => parent.document.body),
      localStorage: denial(() => localStorage.getItem('critical-t004-probe')),
      indexedDB: await denialAsync(() => new Promise((resolve, reject) => {
        const request = indexedDB.open('critical-t004-probe')
        request.onsuccess = () => { request.result.close(); resolve() }
        request.onerror = () => reject(request.error)
      })),
      cacheStorage: await denialAsync(() => caches.keys()),
      network: await denialAsync(() => fetch(new URL('sample.json', scope))),
      cspDirective: await violation,
    }
  }

  async function render() {
    if (legacyImages.length === 0) return null
    const start = performance.now()
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
    renderer.setSize(320, 180, false)
    document.body.append(renderer.domElement)
    const scene = new THREE.Scene()
    const camera = new THREE.PerspectiveCamera(45, 320 / 180, 0.1, 100)
    camera.position.z = 4
    const texture = await new THREE.TextureLoader().loadAsync(legacyImages[2])
    const card = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 1.8), new THREE.MeshBasicMaterial({ map: texture }))
    scene.add(card)
    const gl = renderer.getContext()
    const pixels = []
    for (const angle of [0, 0.5]) {
      await new Promise(resolve => requestAnimationFrame(resolve))
      card.rotation.y = angle
      renderer.render(scene, camera)
      const center = new Uint8Array(4)
      const corner = new Uint8Array(4)
      gl.readPixels(160, 90, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, center)
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, corner)
      if (gl.isContextLost() || gl.getError() !== gl.NO_ERROR || center.every((channel, index) => channel === corner[index])) {
        throw new Error('WebGL did not draw the card')
      }
      pixels.push([...center])
    }
    const backend = gl.getExtension('WEBGL_debug_renderer_info')
    return {
      frames: pixels.length, pixels, revision: THREE.REVISION, gl: gl.getParameter(gl.VERSION),
      renderer: backend ? gl.getParameter(backend.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
      texture: [texture.image.naturalWidth, texture.image.naturalHeight],
      renderMs: Math.round(performance.now() - start),
    }
  }

  function connect(event) {
    if (event.source !== parent || event.data?.type !== 't004-connect' || event.data.instance !== mark || event.ports.length !== 1) return
    window.removeEventListener('message', connect)
    const port = event.ports[0]
    port.onmessage = event => {
      if (event.data?.type === 'ping') port.postMessage({ type: 'pong', instance: mark })
    }
    port.postMessage({ type: 'hello', instance: mark, protocolMajor: 1, protocolMinor: 0 })
    Promise.all([verifyIsolation(), render()]).then(([isolation, render]) => {
      result.textContent = render ? '已验证两帧 WebGL 出帧' : '第三方样本已启动'
      port.postMessage({ type: 'evidence', instance: mark, isolation, render })
    }).catch(error => {
      result.textContent = error.message
      port.postMessage({ type: 'error', instance: mark, message: error.message })
    })
  }
  window.addEventListener('message', connect)
  parent.postMessage({ type: 't004-ready', instance: mark }, '*')
</script>
</body>
</html>
